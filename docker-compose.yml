services:
  cdn:
    build:
      context: .
      dockerfile: apps/cdn/Dockerfile
    image: mionmu/student-helper-cdn:latest
    container_name: student-helper-cdn
    profiles: ["backend","all"]
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - env/.env.cdn
      - env/.env.common
    networks:
      - student-helper-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/cdn/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    image: mionmu/student-helper-auth:latest
    container_name: student-helper-auth
    profiles: ["backend","all"]
    restart: unless-stopped
    env_file:
      - env/.env.auth
      - env/.env.common
    ports:
      - "3002:3002"
    networks:
      - student-helper-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/auth/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  processing:
    build:
      context: .
      dockerfile: apps/processing/Dockerfile
    image: mionmu/student-helper-processing:latest
    container_name: student-helper-processing
    profiles: ["backend","all"]
    restart: unless-stopped
    ports:
      - "3003:3003"
    env_file:
      - env/.env.processing
      - env/.env.common
    networks:
      - student-helper-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/processing/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  quiz:
    build:
      context: .
      dockerfile: apps/quiz/Dockerfile
    image: mionmu/student-helper-quiz:latest
    container_name: student-helper-quiz
    profiles: ["backend","all"]
    restart: unless-stopped
    ports:
      - "3004:3004"
    env_file:
      - env/.env.quiz
      - env/.env.common
    networks:
      - student-helper-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/quiz/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    image: mionmu/student-helper-api-gateway:latest
    container_name: student-helper-api-gateway
    profiles: ["backend","all"]
    restart: unless-stopped
    ports:
      - "4001:4001"
    env_file:
      - env/.env.api-gateway
      - env/.env.common
    depends_on:
      auth:
        condition: service_healthy
      cdn:
        condition: service_healthy
      processing:
        condition: service_healthy
      quiz:
        condition: service_healthy
    networks:
      - student-helper-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: mionmu/student-helper-frontend:latest
    container_name: student-helper-frontend
    profiles: ["frontend","all"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - env/.env.frontend
    networks:
      - student-helper-network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://$(hostname -i):3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  student-helper-network:
    name: student-helper-network
    driver: bridge